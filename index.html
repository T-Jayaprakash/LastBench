<body>
    <!-- Loading State -->
    <div class="app-loader" id="app-loader">
        <div class="loader-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <!-- Service Worker Registration with Update Support -->
    <script>
        // Hide loader when app is ready
        window.addEventListener('load', function () {
            setTimeout(function () {
                var loader = document.getElementById('app-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.transition = 'opacity 0.3s ease-out';
                    setTimeout(function () {
                        loader.style.display = 'none';
                    }, 300);
                }
            }, 500);
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    // Register main service worker
                    const registration = await navigator.serviceWorker.register('/sw.js', {
                        scope: '/'
                    });
                    console.log('[App] SW registered:', registration.scope);

                    // Check for updates periodically
                    setInterval(() => {
                        registration.update();
                    }, 1000 * 60 * 60); // Check every hour

                    // Handle updates
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // New version available
                                console.log('[App] New version available. Update will happen on next reload.');
                                // Auto-update logic removed as per user request to avoid popup.
                                // Users who reload manually will get the new version.
                            }
                        });
                    });

                    // Also register Firebase messaging SW
                    await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                    console.log('[App] Firebase SW registered');

                } catch (error) {
                    console.log('[App] SW registration failed:', error);
                }
            });

            // Handle controller change (when new SW takes over)
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                console.log('[App] New service worker activated');
            });
        }

        // iOS PWA Detection and Enhancements
        (function () {
            // Detect if running as PWA
            const isInStandaloneMode = () =>
                (window.matchMedia('(display-mode: standalone)').matches) ||
                (window.navigator.standalone) ||
                document.referrer.includes('android-app://');

            if (isInStandaloneMode()) {
                document.documentElement.classList.add('pwa-mode');
                console.log('[App] Running in PWA mode');
            }

            // iOS-specific fixes
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isIOS) {
                document.documentElement.classList.add('ios-device');

                // Prevent zoom on input focus
                document.addEventListener('touchstart', function () { }, { passive: true });

                // Fix for iOS viewport height
                const setVH = () => {
                    let vh = window.innerHeight * 0.01;
                    document.documentElement.style.setProperty('--vh', vh + 'px');
                };
                setVH();
                window.addEventListener('resize', setVH);

                // Disable overscroll/bounce
                document.body.addEventListener('touchmove', function (e) {
                    if (e.target === document.body) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }
        })();

        // Handle PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Store for later use by the app
            window.deferredPrompt = deferredPrompt;
            console.log('[App] Install prompt ready');
        });

        window.addEventListener('appinstalled', () => {
            console.log('[App] PWA was installed');
            deferredPrompt = null;
            window.deferredPrompt = null;
        });
    </script>
